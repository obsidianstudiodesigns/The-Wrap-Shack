<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@500;600&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #140d0b; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; color: #f6eee6; font-family: Barlow, sans-serif;
    background: radial-gradient(60% 80% at 80% 60%, rgba(227, 59, 34, 0.45), transparent 70%), radial-gradient(50% 50% at 0% 100%, rgba(163, 32, 14, 0.4), transparent 70%), #140d0b; }
  .photo { position: absolute; right: 0; top: 0; width: 520px; height: 630px; object-fit: cover; object-position: 50% 55%;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 28%); mask-image: linear-gradient(90deg, transparent 0%, #000 28%); }
  .copy { position: absolute; left: 64px; top: 56px; width: 700px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { width: 76px; height: 76px; }
  .brand span { font-family: Anton, sans-serif; font-size: 40px; line-height: 0.95; text-transform: uppercase; }
  .brand small { display: block; font-family: "Barlow Condensed", sans-serif; font-size: 18px; letter-spacing: 0.32em; color: #ff5a33; }
  h1 { margin: 44px 0 0; font-family: Anton, sans-serif; font-weight: 400; font-size: 92px; line-height: 1.02; text-transform: uppercase; }
  .brush { position: relative; display: inline-block; color: #140d0b; padding: 2px 16px 0; margin-left: -6px; margin-top: 6px; z-index: 0; }
  .brush::before { content: ""; position: absolute; inset: 0; z-index: -1; background: #f6b51e; transform: skew(-8deg) rotate(-1.5deg); clip-path: polygon(1% 8%, 99% 0, 100% 86%, 96% 100%, 3% 94%, 0 60%); }
  .sub { margin-top: 26px; font-size: 27px; font-weight: 500; color: #d9c8bc; }
  .cta { position: absolute; left: 64px; bottom: 50px; display: flex; align-items: center; gap: 16px; padding: 14px 30px 14px 16px; border-radius: 999px; background: #e33b22;
    font-family: "Barlow Condensed", sans-serif; font-size: 32px; letter-spacing: 0.04em; text-transform: uppercase; color: #fff8f2; }
  .cta svg { width: 40px; height: 40px; }
</style>
</head>

  <div class="card">
